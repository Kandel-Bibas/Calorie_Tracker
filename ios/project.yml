name: CalorieTracker
options:
  bundleIdPrefix: com.bibas
packages:
  supabase-swift:
    url: https://github.com/supabase-community/supabase-swift
    version: 2.22.0
targets:
  CalorieTracker:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources: [CalorieTracker]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bibas.CalorieTracker
        INFOPLIST_FILE: CalorieTracker/Info.plist
        # Signing — baked in so `xcodegen generate` never resets Team to "None".
        DEVELOPMENT_TEAM: LXPCG9K73H
        CODE_SIGN_STYLE: Automatic
      configs:
        # Both configs hit the public custom domain over HTTPS, so Debug builds
        # work on a physical device without running a local server or switching
        # to Release. Custom domains are exempt from Vercel Deployment Protection,
        # so this stays reachable while the raw *.vercel.app URLs remain protected.
        Debug:
          API_BASE_URL: https://calorie-tracker.bibas.dev
        Release:
          API_BASE_URL: https://calorie-tracker.bibas.dev
    dependencies:
      - package: supabase-swift
        product: Supabase
    # Emit a shared scheme so headless/CI builds resolve `-scheme CalorieTracker`
    # (otherwise the scheme only exists after a first open in Xcode's GUI).
    scheme:
      testTargets:
        - CalorieTrackerTests
  CalorieTrackerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources: [CalorieTrackerTests]
    settings:
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CalorieTracker
